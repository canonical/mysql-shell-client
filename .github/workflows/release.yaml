name: Publish

on:
  workflow_dispatch:

jobs:
  build:
    name: "Build package"
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      VERSION: ${{ steps.export.outputs.VERSION }}
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: "Install poetry"
        run: pipx install poetry
      - name: "Export package information"
        id: export
        run: |
          VERSION=$(poetry version --short)
          if [ "$(git tag -l "${VERSION}")" ]; then
            echo "Tag ${VERSION} already exists. Please bump the project to a greater version."
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
      - name: "Build package"
        run: poetry build
      - name: "Store the distribution packages"
        uses: actions/upload-artifact@v7
        with:
          name: distfiles
          path: dist/

  upload-github:
    name: "Publish to GitHub"
    needs: [build]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: "Download all the dists"
        uses: actions/download-artifact@v8
        with:
          name: distfiles
          path: dist/
      - name: "Create GitHub release"
        run: |
          git tag "${VERSION}"
          git push origin "${VERSION}"
          gh release create "${VERSION}" --generate-notes --title "${VERSION}"
          gh release upload "${VERSION}" dist/*.{tar.gz,whl}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build.outputs.VERSION }}

  upload-pypi:
    name: "Publish to PyPI"
    needs: [build]
    runs-on: ubuntu-26.04
    permissions:
      id-token: write
    steps:
      - name: "Download all the dists"
        uses: actions/download-artifact@v8
        with:
          name: distfiles
          path: dist/
      - name: "Publish to PyPI"
        uses: pypa/gh-action-pypi-publish@release/v1
